name: macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # to attach the DMG to a release when a v* tag is pushed

jobs:
  dmg:
    name: Build ydiskarc.app (Apple Silicon) and DMG
    runs-on: macos-15  # Apple Silicon (arm64) runner
    env:
      # python.org builds include a working Tcl/Tk for the GUI and run on macOS 11+
      PYTHON_VERSION: "3.12.10"
      PY: /Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
      TARGET_ARCH: arm64
      # Signing and notarization run only when the Apple secrets are configured.
      HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Python ${{ env.PYTHON_VERSION }} from python.org
        run: |
          test "$(uname -m)" = arm64
          curl -fsSL -o python.pkg \
            "https://www.python.org/ftp/python/${PYTHON_VERSION}/python-${PYTHON_VERSION}-macos11.pkg"
          sudo installer -pkg python.pkg -target /
          "$PY" -c "import platform, tkinter; print(platform.machine(), 'Tk', tkinter.Tcl().eval('info patchlevel'))"

      - name: Install dependencies
        run: |
          "$PY" -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install . pyinstaller pytest
          echo "VERSION=$(.venv/bin/python -c 'import ydiskarc; print(ydiskarc.__version__)')" >> "$GITHUB_ENV"

      - name: Run tests
        run: .venv/bin/python -m pytest -q

      - name: Import signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
        if: env.HAS_CERT == 'true'
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "CODESIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build ydiskarc.app
        run: .venv/bin/pyinstaller --noconfirm --clean packaging/macos/ydiskarc.spec

      - name: Check the app
        run: PYTHON=.venv/bin/python packaging/macos/check_app.sh "$TARGET_ARCH"

      - name: Build DMG
        run: |
          packaging/macos/make_dmg.sh "$VERSION" "$TARGET_ARCH"
          if [ -n "${CODESIGN_IDENTITY:-}" ]; then
            codesign --force --timestamp --sign "$CODESIGN_IDENTITY" dist/*.dmg
          fi

      - name: Notarize DMG
        if: ${{ steps.signing.outputs.signed == 'true' }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit dist/*.dmg --wait \
            --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
          xcrun stapler staple dist/*.dmg

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: ydiskarc-${{ env.VERSION }}-macos-arm64
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach DMG to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "ydiskarc $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.dmg --clobber
